[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ati"
version = "0.1.0"
description = "Autonomous Adaptive Trading Intelligence for Indian equities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "yfinance>=0.2.40",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "scipy>=1.11.0",
  "scikit-learn>=1.4.0",
  "xgboost>=2.0.0",
  "lightgbm>=4.3.0",
  "pydantic>=2.6.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
  "pyarrow>=15.0.0",
  "joblib>=1.3.0",
]

[project.scripts]
ati = "ati.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["ati*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
